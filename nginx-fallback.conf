# Fallback only for Home Assistant Container/Core (no Supervisor ingress).
# Replace both example values. Include inside the HTTPS server block that serves HA.
# This is less reliable than the add-on because the fixed /protect-ui/ subpath may require
# additional paths after a UniFi update.

location /protect-ui/ {
    proxy_pass https://192.168.1.1/;
    proxy_http_version 1.1;
    proxy_ssl_verify off;
    proxy_ssl_server_name on;
    proxy_set_header Host 192.168.1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Origin https://192.168.1.1;
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;

    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
    proxy_cookie_domain 192.168.1.1 $host;
    proxy_cookie_path / /protect-ui/;
    proxy_redirect ~^https?://[^/]+(/.*)$ /protect-ui$1;

    sub_filter_once off;
    sub_filter_types text/html text/css application/javascript application/json;
    sub_filter '"/proxy/protect' '"/protect-ui/proxy/protect';
    sub_filter "'/proxy/protect" "'/protect-ui/proxy/protect";
    sub_filter '"/api/ws' '"/protect-ui/api/ws';
    sub_filter "'/api/ws" "'/protect-ui/api/ws";
    sub_filter '"/wss' '"/protect-ui/wss';
    sub_filter "'/wss" "'/protect-ui/wss";
}


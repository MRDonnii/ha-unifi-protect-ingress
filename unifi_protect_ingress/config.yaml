name: UniFi Protect Ingress
version: "0.4.0"
slug: unifi-protect-ingress
description: Shows the native UniFi Protect web interface in the Home Assistant sidebar
url: https://github.com/MRDonnii/ha-unifi-protect-ingress/tree/main/unifi_protect_ingress
image: ghcr.io/mrdonnii/ha-unifi-protect-ingress
init: false
stage: experimental
ingress: true
ingress_entry: /protect/dashboard
ingress_stream: true
panel_icon: mdi:cctv
panel_title: Protect
arch:
  - aarch64
  - amd64
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Root proxy used by panel_iframe mode
options:
  protect_url: "https://192.168.1.1"
  verify_ssl: false
  start_path: "/protect/"
  rewrite_paths:
    - /proxy/protect
    - /api/ws
    - /wss
    - /protect
  debug: false
  public_url: ""
  cloudflare_tunnel_token: ""
  back_button_enabled: false
  back_button_target: "/"
  navbar_enabled: false
  navbar_items:
    - "home|Home|/"
    - "camera|Cameras|/dashboard-camera/0"
  navbar_subitems: []
schema:
  protect_url: url
  verify_ssl: bool
  start_path: str
  rewrite_paths:
    - str
  debug: bool
  public_url: str?
  cloudflare_tunnel_token: password?
  back_button_enabled: bool
  back_button_target: str
  navbar_enabled: bool
  navbar_items:
    - str
  navbar_subitems:
    - str

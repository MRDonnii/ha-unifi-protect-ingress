configuration:
  protect_url:
    name: UniFi-konsollens adresse
    description: Direkte LAN-adresse til konsollen, f.eks. https://192.168.1.1
  verify_ssl:
    name: Kontrollér konsollens certifikat
    description: Slå kun fra ved UniFi-konsollens normale selvsignerede certifikat
  start_path:
    name: Startsti
    description: Siden der åbnes fra sidepanelet; normalt /protect/
  rewrite_paths:
    name: Absolutte stier der omskrives
    description: UniFi-stier som skal placeres under Home Assistants dynamiske ingress-sti
  debug:
    name: Fejllogning
    description: Log proxykald under fejlsøgning
  public_url:
    name: Offentlig HTTPS-adresse
    description: Valgfrit Cloudflare-værtsnavn, f.eks. https://protect.example.com. Kræves i HA-appen, når HA selv bruger HTTPS.
  cloudflare_tunnel_token:
    name: Cloudflare Tunnel-token
    description: Valgfri token til en dedikeret fjernadministreret tunnel. Tunnelruten skal pege værtsnavnet på http://localhost:8099.
  back_button_enabled:
    name: Vis tilbage-knap
    description: Vis en flydende tilbage-knap oven på Protect-visningen
  back_button_target:
    name: Tilbage-knappens HA-adresse
    description: HA-stien eller den fulde adresse som knappen skal åbne, f.eks. /lovelace/home
  navbar_enabled:
    name: Vis Home Assistant-navbar
    description: Vis en flydende navbar nederst oven på Protect
  navbar_items:
    name: Navbar-knapper
    description: Én knap pr. linje i formatet ikon|navn|HA-sti. Lad stien være tom for en gruppe med undermenu.
  navbar_subitems:
    name: Navbar-undermenuer
    description: Én undermenu pr. linje i formatet gruppenavn|ikon|navn|HA-sti

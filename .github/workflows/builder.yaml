name: Build and publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - unifi_protect_ingress/**
      - .github/workflows/build-app.yaml
      - .github/workflows/builder.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: ./.github/workflows/build-app.yaml
    with:
      publish: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    secrets: inherit

